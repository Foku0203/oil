[project]
name = "oil-pipeline"
version = "0.1.0"
description = "Thai fuel price, FX and crude oil data platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "tzdata>=2024.1",
    "dagster>=1.10",
    "dagster-webserver>=1.10",
    "dagster-dbt>=0.26",
    "dbt-core>=1.9",
    "dbt-postgres>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
oil = "oil_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oil_pipeline"]

[tool.dagster]
module_name = "oil_pipeline.orchestration.definitions"
code_location_name = "oil_pipeline"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/oil_pipeline/api/*" = ["B006"]  # FastAPI list query defaults are copied per request
"tests/*" = ["E501"]                 # fixtures mirror real API payloads verbatim

[tool.pytest.ini_options]
testpaths = ["tests"]
