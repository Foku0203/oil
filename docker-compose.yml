services:
  postgres:
    image: postgres:16-alpine
    container_name: oil-postgres
    environment:
      POSTGRES_USER: oil
      POSTGRES_PASSWORD: oil
      POSTGRES_DB: oil
      TZ: Asia/Bangkok
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oil -d oil"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
