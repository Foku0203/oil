name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oil
          POSTGRES_PASSWORD: oil
          POSTGRES_DB: oil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oil" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://oil:oil@localhost:5432/oil
      DBT_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Unit tests
        run: uv run pytest -q
      - name: Integration — load 60 days from live APIs, build and test all dbt models
        run: |
          uv run oil backfill --since "$(date -d '60 days ago' +%F)"
          uv run oil transform

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
