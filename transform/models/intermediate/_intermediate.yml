version: 2

models:
  - name: int_retail_price_points
    columns:
      - name: fuel_code
        description: Null when a brand launches a product not yet in the fuel_product_map seed.
        data_tests:
          - not_null:
              config: {severity: warn}

  - name: int_retail_prices_daily
    data_tests:
      - unique_combination:
          arguments: {columns: [brand, fuel_code, price_date]}
    columns:
      - name: price_thb
        data_tests: [not_null]

  - name: int_fx_rates_daily
    data_tests:
      - unique_combination:
          arguments: {columns: [currency, rate_date]}
    columns:
      - name: thb_per_unit
        data_tests: [not_null]

  - name: int_crude_prices_daily
    data_tests:
      - unique_combination:
          arguments: {columns: [benchmark, price_date]}
